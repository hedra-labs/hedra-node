name: publish-npm
# Builds the hedra-node package from the committed SDK and publishes to npm.
# Triggered when a GitHub Release is published. Requires the HEDRA_NPM_TOKEN secret.
#
# The published version is derived from the release tag, NOT from package.json.
# package.json is .fernignore'd and hand-maintained, so its version drifts from
# what is actually being released -- before this, a release at v1.0.0 would have
# tagged v1.0.0 and then published package.json's stale number to npm. See
# ENG-10111.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, e.g. 1.0.0 (required: a manual run has no release tag to derive it from)"
        required: true
        type: string
      dry_run:
        description: "Build, test and pack, but stop short of uploading to npm"
        type: boolean
        default: false

# `contents: write` is for attaching the packed tarball to the GitHub Release
# (see the pack/upload steps); npm itself is authenticated with NODE_AUTH_TOKEN,
# not with the workflow token.
permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # Manual approval gate. `release: published` fires this workflow with no human
    # in the loop -- including when fern-config's release-sdks.yml cuts the Release
    # remotely -- so this is the only thing standing between a published Release and
    # a live npm publish. The job queues until a required reviewer approves it.
    #
    # The protection lives in the environment's settings, NOT here: GitHub creates a
    # referenced environment on first use if it is missing, WITHOUT protection rules,
    # so a missing or unconfigured `npm-publish` environment silently publishes
    # rather than failing. If you rename this, configure the new environment first.
    environment: npm-publish
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      # Resolves from the release tag on a `release` run, or from the input on a
      # manual one. Fails loudly rather than falling back to package.json, so a
      # misconfigured run cannot quietly publish the wrong number.
      - name: Resolve version to publish
        id: resolve
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          raw="${RELEASE_TAG:-${INPUT_VERSION:-}}"
          if [ -z "$raw" ]; then
            echo "::error::No version to publish. A release run takes it from the release tag; a manual run requires the 'version' input."
            exit 1
          fi
          version="${raw#v}"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'; then
            echo "::error::Resolved version '$version' (from '$raw') is not valid semver; refusing to publish."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Publishing version $version (from '$raw')."

      - name: Set up node
        uses: actions/setup-node@v7
        with:
          registry-url: "https://registry.npmjs.org"

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # No commit: the working copy is discarded when the job ends. --allow-same-version
      # keeps this a no-op rather than an error when package.json already matches the tag.
      - name: Write the resolved version into package.json
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
        run: npm version --no-git-tag-version --allow-same-version "$VERSION"

      # src/version.ts is stamped by Fern, not hand-maintained: it is deliberately NOT
      # .fernignore'd, and generate-sdks.yml pins --version to this repo's package.json
      # (fern-config#37). So it tracks main's package.json, not the tag being released,
      # and drifts whenever the two disagree. This is the only thing that surfaces that.
      # Warn rather than fail on purpose: turning this into a hard failure is a separate
      # decision, deliberately not taken alongside the 1.0.0 bump (ENG-10134).
      - name: Check the runtime SDK_VERSION matches
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          set -euo pipefail
          sdk_version="$(grep -oE 'SDK_VERSION *= *"[^"]*"' src/version.ts | grep -oE '"[^"]*"' | tr -d '"')"
          if [ "$sdk_version" != "$VERSION" ]; then
            echo "::warning::src/version.ts reports SDK_VERSION=$sdk_version but publishing $VERSION. Bump package.json on main to $VERSION so the next regeneration stamps it, or set src/version.ts directly."
          else
            echo "SDK_VERSION matches the published version ($VERSION)."
          fi

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      # npm publishes straight from the working tree, so unlike the Python job
      # there is no dist/ full of artifacts to attach -- the tarball has to be
      # made. `npm pack --silent` prints the filename it wrote.
      - name: Pack the tarball
        id: pack
        run: |
          set -euo pipefail
          tarball="$(npm pack --silent)"
          echo "tarball=${tarball}" >> "$GITHUB_OUTPUT"
          echo "::notice::Packed ${tarball} ($(du -h "${tarball}" | cut -f1))."

      # Attach it to the GitHub Release. npm remains the package's home -- this
      # is for provenance, attestation checks, and air-gapped installs that
      # cannot reach the registry.
      #
      # Ordered BEFORE the publish deliberately, exactly as in hedra-python#67:
      # an upload failure here leaves a fully recoverable state, because nothing
      # is on npm yet and re-running the whole job fixes it. Failing *after* the
      # publish would leave a split state a re-run cannot repair, since npm
      # rejects re-publishing a version that already exists.
      - name: Attach the tarball to the GitHub Release
        if: ${{ inputs.dry_run != true }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_VERSION: ${{ inputs.version }}
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: |
          set -euo pipefail
          raw="${RELEASE_TAG:-${INPUT_VERSION:-}}"
          if [ -z "$raw" ]; then
            echo "::error::No release tag or version input; cannot locate the Release to upload to."
            exit 1
          fi
          case "$raw" in
            v*) tag="$raw" ;;
            *)  tag="v${raw}" ;;
          esac
          if ! gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "::notice::No GitHub Release ${tag} exists; skipping asset upload."
            exit 0
          fi
          gh release upload "$tag" "$TARBALL" --repo "${{ github.repository }}" --clobber
          echo "::notice::Attached ${TARBALL} to ${tag}."

      # `npm publish --dry-run` runs the full pack-and-validate path and reports
      # exactly what would be uploaded, without uploading. A `release: published`
      # run supplies no inputs, so DRY_RUN is the empty string and the real
      # publish is what happens -- the default must stay false.
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN || secrets.HEDRA_NPM_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          if [ "${DRY_RUN}" = "true" ]; then
            echo "::notice::Dry run - packing only; nothing is uploaded to npm."
            npm publish --access public --dry-run
          else
            echo "::notice::Publishing to npm for real."
            npm publish --access public
          fi
