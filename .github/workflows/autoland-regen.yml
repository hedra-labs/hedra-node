name: Autoland regeneration PRs

# Lands fern-api[bot] "SDK regeneration" PRs without a human.
#
# Responsibility split, mirroring hedra-labs/deployments:
#   - This workflow closes superseded PRs, rebases the newest onto main,
#     enables auto-merge, and approves. It never merges.
#   - GitHub's auto-merge does the landing, once the required checks
#     (regen-shape + this repo's own CI) are green.
#
# Safety: runs on pull_request_target so it can reach the App credentials and
# executes the workflow definition from main, not from the PR. It never checks
# out or runs PR code -- commits are replayed as data. The job is gated on the
# bot's immutable numeric account ID.
#
# Deliberately absent: any comparison of the PR's version against main's. Since
# fern-config#44 a regeneration stamps a computed X.Y.Z-dev that differs from
# main by design, so such a gate would close every PR.

on:
  pull_request_target:
    types: [opened, reopened, synchronize]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: autoland-regen
  cancel-in-progress: false

jobs:
  autoland:
    runs-on: ubuntu-latest
    # Always run on push to main and manual dispatch; on PR events only for
    # fern-api[bot] regeneration branches targeting main.
    if: >-
      github.event_name != 'pull_request_target' ||
      (startsWith(github.event.pull_request.head.ref, 'fern-bot/') &&
       github.event.pull_request.base.ref == 'main' &&
       contains(fromJSON('[115122769]'), github.event.pull_request.user.id))
    steps:
      - name: Mint App installation token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.SDK_BOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.SDK_BOT_APP_PRIVATE_KEY }}

      # Minted before checkout so the token installs into the git credential
      # helper: pushes made with the default GITHUB_TOKEN fire no downstream
      # workflows, which would leave a rebased head with zero check runs.
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Advance the regeneration queue
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          REPO: ${{ github.repository }}
          FERN_BOT_ID: "115122769"
        run: |
          set -euo pipefail

          git config user.name "${APP_SLUG}[bot]"
          git config user.email "$(gh api "/users/${APP_SLUG}[bot]" --jq .id)+${APP_SLUG}[bot]@users.noreply.github.com"

          # Classify a PR by the version its manifest carries at the PR head:
          # `X.Y.Z-dev` is a regeneration, `X.Y.Z` is a release. This file must
          # stay byte-identical across the three SDK repos (autoland-drift-check
          # enforces it), so the classifier finds its own manifest rather than
          # being told which one to read.
          classify() {  # $1 = head sha -> echoes "release" or "regen"
            local sha="$1" m body v
            for m in pyproject.toml package.json Cargo.toml; do
              body="$(gh api "repos/${REPO}/contents/${m}?ref=${sha}" --jq .content 2>/dev/null | base64 -d)" || continue
              if [[ -z "$body" ]]; then continue; fi
              if [[ "$m" == "package.json" ]]; then
                v="$(printf '%s' "$body" | jq -r '.version // empty')"
              else
                v="$(printf '%s' "$body" | sed -n 's/^version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' | head -1)"
              fi
              if [[ -z "$v" ]]; then continue; fi
              case "$v" in
                *-dev) echo regen ;;
                *)     echo release ;;
              esac
              return 0
            done
            return 1
          }

          # Candidates, oldest first. Listed via the REST API rather than
          # `gh pr list --json author`, which exposes only login/is_bot -- the
          # authoritative gate is the immutable numeric account ID.
          mapfile -t queue < <(
            gh api "repos/${REPO}/pulls?state=open&per_page=100" \
              --jq "[ .[]
                      | select(.user.id == ${FERN_BOT_ID})
                      | select(.head.ref | startswith(\"fern-bot/\"))
                      | select(.base.ref == \"main\") ]
                    | sort_by(.created_at)
                    | .[] | \"\(.number)\t\(.head.ref)\t\(.head.sha)\""
          )

          if [[ "${#queue[@]}" -eq 0 ]]; then
            echo "No open regeneration PRs."
            exit 0
          fi

          # Rank: a release PR outranks every regeneration PR regardless of age,
          # and a regeneration can never close a release. Among regenerations
          # the newest still wins, since each is a whole snapshot.
          #
          # A release closes regenerations rather than deferring them because a
          # regeneration's version was computed BEFORE the release: rebasing it
          # onto the released commit with -X theirs would walk main backwards
          # into a dev window on a version already published. The discarded
          # surface is regenerated by the next fern/** push.
          releases=(); regens=()
          for row in "${queue[@]}"; do
            row_pr="$(cut -f1 <<<"$row")"
            row_sha="$(cut -f3 <<<"$row")"
            kind="$(classify "$row_sha")" || {
              echo "::error::Could not read a manifest version for PR #${row_pr} at ${row_sha}; refusing to close anything."
              exit 1
            }
            if [[ "$kind" == "release" ]]; then releases+=("$row"); else regens+=("$row"); fi
          done

          if [[ "${#releases[@]}" -gt 0 ]]; then
            head_row="${releases[-1]}"
            head_pr="$(cut -f1 <<<"$head_row")"
            for row in "${queue[@]}"; do
              row_pr="$(cut -f1 <<<"$row")"
              if [[ "$row_pr" == "$head_pr" ]]; then continue; fi
              echo "Closing #${row_pr}: SDK release #${head_pr} takes priority."
              gh pr close "$row_pr" --repo "$REPO" \
                --comment "Closed: SDK release #${head_pr} is in progress and takes priority. This regeneration will be recreated by the next generation run."
            done
          else
            head_row="${regens[-1]}"
            head_pr="$(cut -f1 <<<"$head_row")"
            for row in "${regens[@]}"; do
              row_pr="$(cut -f1 <<<"$row")"
              if [[ "$row_pr" == "$head_pr" ]]; then continue; fi
              echo "Closing #${row_pr} as superseded."
              gh pr close "$row_pr" --repo "$REPO" \
                --comment "Superseded by a newer SDK regeneration."
            done
          fi

          pr="$head_pr"
          head_ref="$(cut -f2 <<<"$head_row")"
          echo "::group::Head of queue: #${pr} (${head_ref})"

          # Defence in depth. regen-shape is the primary gate and is a required
          # check; this repeats the two file guards so a bug there cannot
          # auto-approve a workflow-modifying PR.
          files="$(gh api "repos/${REPO}/pulls/${pr}/files" --paginate --jq '.[].filename')"
          if grep -qE '^\.github/' <<<"$files"; then
            echo "::error::PR #${pr} touches .github/ — refusing to autoland."
            exit 1
          fi
          if grep -qx '\.fernignore' <<<"$files"; then
            echo "::error::PR #${pr} edits .fernignore — refusing to autoland."
            exit 1
          fi

          git fetch origin main
          git fetch origin "+refs/heads/${head_ref}:refs/remotes/origin/${head_ref}"

          if ! git merge-base --is-ancestor origin/main "origin/${head_ref}"; then
            echo "#${pr} is behind main; merging main in."
            git checkout -B "$head_ref" "origin/${head_ref}"
            # MERGE, not rebase (ENG-10280). A rebase rewrites every commit on
            # this branch — including the one Fern Replay recorded as the
            # generation — so the recorded SHA is orphaned regardless of how the
            # PR is later landed, and Replay then persists `user_owned: true`
            # onto patches whose ownership it merely could not verify. That
            # write is irreversible. A merge leaves the original commits in
            # place and reachable.
            #
            # THE FLAG INVERTS BETWEEN THE TWO COMMANDS. `rebase -X theirs` and
            # `merge -X ours` both mean "resolve conflicting hunks in the PR's
            # favour", which is what generated content wants; the ours/theirs
            # roles swap because rebase replays our commits onto upstream.
            # Measured in a scratch repo, not reasoned about. .fernignore'd
            # files never appear in a regeneration diff either way, so main's
            # copies of them survive untouched.
            if ! git merge -X ours --no-edit origin/main; then
              git merge --abort || true
              gh pr comment "$pr" --repo "$REPO" \
                --body "Autoland: merging \`main\` into this branch could not auto-resolve. Leaving this for a human."
              exit 0
            fi
            if git diff --quiet origin/main; then
              gh pr close "$pr" --repo "$REPO" \
                --comment "Superseded: this regeneration is already on \`main\`."
              exit 0
            fi
            git push --force-with-lease="${head_ref}:$(git rev-parse "origin/${head_ref}")" \
              origin "HEAD:${head_ref}"
            echo "#${pr} has main merged in and was pushed; fresh checks will run."
          fi

          # Land regeneration PRs with a MERGE COMMIT, not a squash (ENG-10280).
          # A squash writes a brand-new commit to main and the branch is then
          # deleted, so the SHA Fern Replay recorded as the generation is
          # orphaned — which is why every regeneration logged "Base generation
          # <sha> is unreachable", and why Replay then wrote `user_owned: true`
          # onto patches it merely could not verify. Do not "fix" that warning
          # by fetching deeper: the clone is complete, the object is gone.
          #
          # Needs `allow_merge_commit: true` on the repo. Squash can stay
          # enabled for humans — this only picks the strategy for regeneration
          # PRs. Where merge commits are disabled we fall back rather than stall
          # regeneration, but loudly, because the fallback re-opens ENG-10280.
          #
          # Name the merge commit so Replay's generation scan can still find an
          # anchor (ENG-10280, second half). ReplayDetector's
          # findPreviousGenerationFromHistory() walks
          # `git log --first-parent HEAD` — no --no-merges — and takes the FIRST
          # commit that is authored by fern-api[bot] or whose SUBJECT starts with
          # `[fern-generated]` / `[fern-replay]`. Merge landing puts the real
          # generation on the SECOND parent, invisible to that walk, while the
          # walk still succeeds on an older SQUASHED regeneration further back.
          # So the anchor freezes and the detection range grows by one commit per
          # PR forever: measured 2026-08-20, main's anchor was still
          # `f4a1372 SDK regeneration (#72)`, fourteen first-parent commits back.
          # Subjecting the merge commit itself puts a current, permanently
          # reachable anchor on the first-parent chain. Detection is --no-merges,
          # so the merge commit can never be mistaken for a customization.
          #
          # `[fern-replay]`, not `[fern-generated]`, and the distinction is
          # load-bearing. Both satisfy the detector, but `[fern-generated]` would
          # also be picked up by AutoVersionStep's own stricter first-parent walk
          # (`startsWith("[fern-generated]")`), re-anchoring the autoversion
          # baseline and changing the computed X.Y.Z-dev bump, and by the
          # `PVe(u) && !KQl(u)` generation scan, which likewise does not pass
          # --no-merges. `[fern-replay]` is inert to both. Verified against
          # fern-api 5.100.0's cli.cjs; re-read the applicator after a CLI bump,
          # because this rides on an undocumented predicate and will fail
          # silently — a rotting anchor, not an error — if it changes.
          #
          # Subject only on the merge path. The squash fallback already matches
          # the detector through the author clause, and prefixing it would drop
          # it out of the `!KQl` generation scan it currently appears in.
          if [[ "$(gh api "repos/${REPO}" --jq '.allow_merge_commit')" == "true" ]]; then
            strategy="--merge"
            subject_args=(-t "[fern-replay] SDK regeneration (#${pr})")
          else
            strategy="--squash"
            subject_args=()
            echo "::warning::merge commits are disabled on ${REPO}; falling back to --squash. Recorded generation SHAs will be orphaned — see ENG-10280."
          fi

          # Auto-merge BEFORE approving. The PR is still BLOCKED for want of a
          # review here, so --auto always has something to wait for and attaches
          # reliably. enablePullRequestAutoMerge refuses ("unstable status") on a
          # PR with nothing left to wait for, which is what a post-approval call
          # would often hit.
          if [[ "$(gh pr view "$pr" --repo "$REPO" --json autoMergeRequest --jq '.autoMergeRequest != null')" != "true" ]]; then
            set +e
            out="$(gh pr merge --auto "$strategy" ${subject_args[@]+"${subject_args[@]}"} "$pr" --repo "$REPO" 2>&1)"; rc=$?
            set -e
            echo "$out"
            if [[ $rc -ne 0 ]]; then
              if [[ "$out" == *"unstable status"* ]]; then
                echo "Already fully mergeable; merging directly."
                gh pr merge "$strategy" ${subject_args[@]+"${subject_args[@]}"} "$pr" --repo "$REPO"
              else
                exit 1
              fi
            fi
          else
            echo "Auto-merge already attached."
          fi

          if [[ "$(gh pr view "$pr" --repo "$REPO" --json reviewDecision --jq .reviewDecision)" != "APPROVED" ]]; then
            gh pr review --approve "$pr" --repo "$REPO"
          else
            echo "Already approved."
          fi

          echo "::endgroup::"
