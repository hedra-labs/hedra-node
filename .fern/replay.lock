      Subject: [PATCH] chore: reset manifest version to 0.9.9 as the
       computed-release baseline (#41)
      MIME-Version: 1.0
      Content-Type: text/plain; charset=UTF-8
      Content-Transfer-Encoding: 8bit

      Under the manifest-sourced versioning model from hedra-labs/fern-config#44, package.json at HEAD is this repo's version source of truth. The accumulated v3 drift diffs as major, and a major bump on 0.9.9 computes exactly 1.0.0 — so the next regeneration stamps 1.0.0-dev and the first release publishes 1.0.0 through the normal computed flow, with no force_version bootstrap.


      Claude-Session: https://claude.ai/code/session_016bTLDWYzRbzeLqemL9ARDe

      Co-authored-by: Claude Fable 5 <noreply@anthropic.com>
      ---
       package.json | 2 +-
       1 file changed, 1 insertion(+), 1 deletion(-)

      diff --git a/package.json b/package.json
      index 8fe4712..5d63860 100644
      --- a/package.json
      +++ b/package.json
      @@ -1,6 +1,6 @@
       {
           "name": "hedra-node",
      -    "version": "1.0.0",
      +    "version": "0.9.9",
           "private": false,
           "repository": {
               "type": "git",
      -- 
      2.52.0

